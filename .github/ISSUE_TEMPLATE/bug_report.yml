name: Bug report
description: A defect in the MCP server, CLI, bridge, import/export, or documentation
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - MCP server (stdio)
        - CLI or runtime commands
        - Blender bridge
        - Import or export
        - Materials, baking, or geometry
        - Rigging or animation
        - Optional image-to-3D generation
        - Documentation
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Tool name and arguments, CLI command, or MCP request
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error message and relevant `cavi-blender-mcp runtime status --json` output
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and version, Blender version, Python version, install method
    validations:
      required: true

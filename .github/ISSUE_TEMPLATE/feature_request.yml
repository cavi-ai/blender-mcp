name: Feature request
description: A Blender capability, tool, or workflow the server does not cover yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The asset task that is not expressible today
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Proposed tool, argument, or resource change
    validations:
      required: true

  - type: textarea
    id: blender-api
    attributes:
      label: Blender API evidence
      description: The Blender API or operator this needs, and the Blender version you checked
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This changes an existing tool contract
        - label: This adds a mutation of the open scene
        - label: This adds a new bounded input or output budget

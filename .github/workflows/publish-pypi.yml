name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  # Publishes an existing release tag; dry_run stops after the build.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (vX.Y.Z)
        required: true
        type: string
      dry_run:
        description: Build and verify without upload
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions: {}

concurrency:
  group: publish-pypi-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The PyPI trusted publisher for cavi-blender-mcp names this workflow file
    # and the `pypi` environment; renaming either stops publishing.
    environment: pypi
    permissions:
      contents: read
      # PyPI exchanges this OIDC token for a short-lived upload token.
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == 'false' }}
    steps:
      - name: Require a release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::${RELEASE_TAG} is not a vX.Y.Z release tag"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Match the release tag to the package version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::release tag ${RELEASE_TAG} does not match package version ${version}"
            exit 1
          fi

      - name: Test the release source
        run: |
          uv sync --locked --dev
          uv run --locked python -m unittest discover -s tests
          uv run --locked ruff check .

      - name: Build sdist and wheel
        run: |
          uv build --out-dir dist
          uvx twine check --strict dist/*

      # Resolves dependencies the way a PyPI install does, without uv.lock.
      - name: Run the wheel from an unlocked install
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke" dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import cavi_blender_mcp.server"

      # A PyPI version cannot be re-uploaded; skip-existing makes a re-run a no-op.
      - name: Publish
        if: ${{ env.PUBLISH == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

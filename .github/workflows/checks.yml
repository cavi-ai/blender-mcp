name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked --dev
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked ruff check .
      - run: uv run --locked python -m scripts.docs.build
      - run: uv run --locked python -m scripts.docs.verify
      - run: uv build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run eval:protocol
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mcp-eval-reports
          path: |
            .tmp/evals/*/cases.json
            .tmp/evals/*/mcpeval.json
          if-no-files-found: error

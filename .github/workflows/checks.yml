name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merged-pr:
    # A main push whose exact tree passed this workflow on its merged pull request skips the suite steps.
    # The suite job still runs and passes, so pin-consumers keeps its needs.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.pr.outputs.tested }}
    steps:
      - id: pr
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty' || true)
          [ -n "$head" ] || exit 0
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha || true)
          [ -n "$tree" ] && [ "$tree" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.tree.sha || true)" ] || exit 0
          workflow=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&status=success&head_sha=$head" --jq "[.workflow_runs[] | select(.path == \"${workflow%@*}\")] | length" || echo 0)
          if [ "$passed" -gt 0 ]; then echo "tested=true" >> "$GITHUB_OUTPUT"; fi

  pin-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      # Nothing here is pinned by hand. The guard on main judges every pull request.
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git cat-file -e "$BASE:scripts/pin_guard.py"; then
            git show "$BASE:scripts/pin_guard.py" > "$RUNNER_TEMP/pin_guard.py"
          else
            cp scripts/pin_guard.py "$RUNNER_TEMP/pin_guard.py"
          fi
          python3 "$RUNNER_TEMP/pin_guard.py" "$BASE" "$HEAD"

  python:
    needs: [pin-guard, merged-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # tags give the version and the documented release
      - uses: astral-sh/setup-uv@v7
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          python-version: '3.15'
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv sync --locked --dev
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python -m unittest discover -s tests
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked ruff check .
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python -m scripts.docs.build
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python -m scripts.docs.verify
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv build
      - name: Resolve the local-generation requirements
        if: needs.merged-pr.outputs.tested != 'true'
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/neural"
          uv pip install --dry-run --python "$RUNNER_TEMP/neural" -r requirements-neural.txt
          uv pip install --dry-run --python "$RUNNER_TEMP/neural" -r requirements-triposg.txt
      - uses: actions/setup-node@v7
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          node-version: '26'
      - name: Build MCP Eval from main
        if: needs.merged-pr.outputs.tested != 'true'
        run: |
          cargo install --locked --git https://github.com/cavi-ai/mcp-eval --branch main \
            --root "$RUNNER_TEMP/mcp-eval" mcpeval
          echo "MCPEVAL_EXECUTABLE=$RUNNER_TEMP/mcp-eval/bin/mcpeval" >> "$GITHUB_ENV"
          python3 - "$RUNNER_TEMP/mcp-eval/.crates2.json" >> "$GITHUB_ENV" <<'PYTHON'
          import json
          import re
          import sys
          with open(sys.argv[1]) as stream:
              installed = json.load(stream)["installs"]
          source = next(key for key in installed if key.startswith("mcpeval "))
          revision = source.rsplit("#", 1)[1].removesuffix(")")
          assert re.fullmatch("[0-9a-f]{40}", revision), source
          print(f"MCPEVAL_SOURCE_REVISION={revision}")
          PYTHON
          mkdir -p .tmp/evals/evaluator
          cp "$RUNNER_TEMP/mcp-eval/.crates2.json" .tmp/evals/evaluator/cargo-install.json
      - if: needs.merged-pr.outputs.tested != 'true'
        run: npm run eval:protocol
      - name: Install Blender 5.3.0
        if: needs.merged-pr.outputs.tested != 'true'
        env:
          BLENDER_ARCHIVE: blender-5.3.0-linux-x64.tar.xz
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$BLENDER_ARCHIVE" \
            "https://ftp.halifax.rwth-aachen.de/blender/release/Blender5.3/$BLENDER_ARCHIVE"
          echo "dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05  $RUNNER_TEMP/$BLENDER_ARCHIVE" | sha256sum --check
          tar -xf "$RUNNER_TEMP/$BLENDER_ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.3.0-linux-x64" >> "$GITHUB_PATH"
      - name: Evaluate native Blender
        if: needs.merged-pr.outputs.tested != 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a npm run eval:core
      - name: Check saved project switching
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_open_project_mcp.py --blender "$(command -v blender)"
      - name: Check Rigify rig generation
        if: needs.merged-pr.outputs.tested != 'true'
        run: blender --background --factory-startup --python-exit-code 1 --python tests/blender_rigify.py
      - name: Check face-region modeling
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_mesh_regions_mcp.py --blender "$(command -v blender)"
      - name: Check selected-face UV layout
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_uv_regions_mcp.py --blender "$(command -v blender)"
      - name: Check seam-based UV layout
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_seam_uv_mcp.py --blender "$(command -v blender)"
      - name: Check selected-face texture density
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_uv_density_mcp.py --blender "$(command -v blender)"
      - name: Check source vertex translation
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_vertex_edit_mcp.py --blender "$(command -v blender)"
      - name: Check connected proportional editing
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_vertex_falloff_mcp.py --blender "$(command -v blender)"
      - name: Check symmetric source editing
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_vertex_symmetry_mcp.py --blender "$(command -v blender)"
      - name: Check source and posed surface picking
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_surface_pick_mcp.py --blender "$(command -v blender)"
      - name: Check rendered camera pixel picking
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_camera_pick_mcp.py --blender "$(command -v blender)"
      - name: Check scene surface discovery
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_scene_pick_mcp.py --blender "$(command -v blender)"
      - name: Check evaluated scene placement
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_scene_spatial_mcp.py --blender "$(command -v blender)"
      - name: Check rendered geometry identities
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_geometry_identity_mcp.py --blender "$(command -v blender)"
      - name: Check object deletion and shared data
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_object_delete_mcp.py --blender "$(command -v blender)"
      - name: Check source-face material assignment
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_face_material_mcp.py --blender "$(command -v blender)"
      - name: Check connected source-face queries
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_face_region_mcp.py --blender "$(command -v blender)"
      - name: Check source UV island editing
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_uv_island_mcp.py --blender "$(command -v blender)"
      - name: Check named modifier editing
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_modifier_mcp.py --blender "$(command -v blender)"
      - name: Check shader link editing
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_shader_link_mcp.py --blender "$(command -v blender)"
      - name: Check native shader node creation
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_shader_node_mcp.py --blender "$(command -v blender)"
      - name: Check native shader ramps
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_shader_ramp_mcp.py --blender "$(command -v blender)"
      - name: Check existing shader node controls
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_shader_control_mcp.py --blender "$(command -v blender)"
      - name: Check native shader group instances
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_shader_group_mcp.py --blender "$(command -v blender)"
      - name: Check native shader function authoring
        if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python tests/native_shader_group_author_mcp.py --blender "$(command -v blender)"
      - uses: actions/upload-artifact@v7
        if: always() && needs.merged-pr.outputs.tested != 'true'
        with:
          name: mcp-eval-reports
          path: |
            .tmp/evals/*/cases.json
            .tmp/evals/*/mcpeval.json
            .tmp/evals/*/evaluator.json
            .tmp/evals/evaluator/cargo-install.json
            .tmp/evals/*/blender.log
          if-no-files-found: error

  pin-consumers:
    # A green main opens the server pin pull request in game-art-pipeline, checks it here and merges it.
    needs: [python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pin-consumers
      cancel-in-progress: false
    env:
      # Fine-grained token: contents read on the server repos; contents and pull requests write on the consumer.
      GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
    steps:
      - name: Require CONSUMER_DISPATCH_TOKEN
        run: test -n "$GH_TOKEN" || { echo "::error::Add the CONSUMER_DISPATCH_TOKEN repository secret"; exit 1; }
      - uses: actions/checkout@v7
        with:
          repository: cavi-ai/game-art-pipeline
          token: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          submodules: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.15'
      - name: Server access for uv
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/cavi-ai/".insteadOf "https://github.com/cavi-ai/"
      - id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/servers.py sync > "$RUNNER_TEMP/sync.json"
          cat "$RUNNER_TEMP/sync.json"
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["changed"] else 1)' "$RUNNER_TEMP/sync.json"; then
            key=$(git submodule status | awk '{gsub(/^[-+U]/, "", $1); print substr($1, 1, 7)}' | paste -sd- -)
            echo "branch=bot/pin-servers-$key" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the pinned consumer
        if: steps.sync.outputs.branch
        run: |
          uv sync --locked --dev
          uv run --locked ruff check scripts tests skills
          for suite in tests skills/blender-unity-assets/scripts skills/unity-hdrp/scripts; do
            uv run --locked python -m unittest discover -s "$suite" || exit 1
          done
      - name: Propose and merge the pin
        if: steps.sync.outputs.branch
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          body=$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1]))["moved"]; print("\n".join("- %s %s -> %s" % (r, (v["from"] or "new")[:7], v["to"][:7]) for r, v in m.items()))' "$RUNNER_TEMP/sync.json")
          if ! git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            git switch -c "$BRANCH"
            git add -A -- .gitmodules pyproject.toml uv.lock servers plugin.json .claude-plugin .codex-plugin
            git commit -q -m "chore: pin servers to main"
            git push -q origin "$BRANCH"
          fi
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            gh pr list --state open --json number,headRefName -q '.[] | select(.headRefName | startswith("bot/pin-servers-")) | "\(.number) \(.headRefName)"' | while read -r old head; do
              if [ "$head" != "$BRANCH" ]; then
                gh pr close "$old" --delete-branch --comment "Superseded by a newer server pin."
              fi
            done
            gh pr create --head "$BRANCH" --title "chore: pin servers to main" --body "$body"
          fi
          gh pr merge "$BRANCH" --squash

name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      # Nothing here is pinned by hand. The guard on main judges every pull request.
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git cat-file -e "$BASE:scripts/pin_guard.py"; then
            git show "$BASE:scripts/pin_guard.py" > "$RUNNER_TEMP/pin_guard.py"
          else
            cp scripts/pin_guard.py "$RUNNER_TEMP/pin_guard.py"
          fi
          python3 "$RUNNER_TEMP/pin_guard.py" "$BASE" "$HEAD"

  python:
    needs: [pin-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # tags give the version and the documented release
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.15'
      - run: uv sync --locked --dev
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked ruff check .
      - run: uv run --locked python -m scripts.docs.build
      - run: uv run --locked python -m scripts.docs.verify
      - run: uv build
      - name: Resolve the local-generation requirements
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/neural"
          uv pip install --dry-run --python "$RUNNER_TEMP/neural" -r requirements-neural.txt
          uv pip install --dry-run --python "$RUNNER_TEMP/neural" -r requirements-triposg.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build MCP Eval from main
        run: |
          cargo install --locked --git https://github.com/cavi-ai/mcp-eval --branch main \
            --root "$RUNNER_TEMP/mcp-eval" mcpeval
          echo "MCPEVAL_EXECUTABLE=$RUNNER_TEMP/mcp-eval/bin/mcpeval" >> "$GITHUB_ENV"
          python3 - "$RUNNER_TEMP/mcp-eval/.crates2.json" >> "$GITHUB_ENV" <<'PYTHON'
          import json
          import re
          import sys
          with open(sys.argv[1]) as stream:
              installed = json.load(stream)["installs"]
          source = next(key for key in installed if key.startswith("mcpeval "))
          revision = source.rsplit("#", 1)[1].removesuffix(")")
          assert re.fullmatch("[0-9a-f]{40}", revision), source
          print(f"MCPEVAL_SOURCE_REVISION={revision}")
          PYTHON
          mkdir -p .tmp/evals/evaluator
          cp "$RUNNER_TEMP/mcp-eval/.crates2.json" .tmp/evals/evaluator/cargo-install.json
      - run: npm run eval:protocol
      - name: Install Blender 5.2.3 LTS
        env:
          BLENDER_ARCHIVE: blender-5.2.3-linux-x64.tar.xz
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$BLENDER_ARCHIVE" \
            "https://mirror.blender.org/release/Blender5.2/$BLENDER_ARCHIVE"
          echo "78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec  $RUNNER_TEMP/$BLENDER_ARCHIVE" | sha256sum --check
          tar -xf "$RUNNER_TEMP/$BLENDER_ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.2.3-linux-x64" >> "$GITHUB_PATH"
      - name: Evaluate native Blender
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a npm run eval:core
      - name: Check saved project switching
        run: uv run --locked python tests/native_open_project_mcp.py --blender "$(command -v blender)"
      - name: Check face-region modeling
        run: uv run --locked python tests/native_mesh_regions_mcp.py --blender "$(command -v blender)"
      - name: Check selected-face UV layout
        run: uv run --locked python tests/native_uv_regions_mcp.py --blender "$(command -v blender)"
      - name: Check seam-based UV layout
        run: uv run --locked python tests/native_seam_uv_mcp.py --blender "$(command -v blender)"
      - name: Check selected-face texture density
        run: uv run --locked python tests/native_uv_density_mcp.py --blender "$(command -v blender)"
      - name: Check source vertex translation
        run: uv run --locked python tests/native_vertex_edit_mcp.py --blender "$(command -v blender)"
      - name: Check connected proportional editing
        run: uv run --locked python tests/native_vertex_falloff_mcp.py --blender "$(command -v blender)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mcp-eval-reports
          path: |
            .tmp/evals/*/cases.json
            .tmp/evals/*/mcpeval.json
            .tmp/evals/*/evaluator.json
            .tmp/evals/evaluator/cargo-install.json
            .tmp/evals/*/blender.log
          if-no-files-found: error

  pin-consumers:
    # A green main moves the blender-mcp pin in game-art-pipeline through its pin-servers workflow.
    needs: [python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch server-merged to game-art-pipeline
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: gh api repos/cavi-ai/game-art-pipeline/dispatches --method POST -f event_type=server-merged

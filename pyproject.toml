[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cavi-blender-mcp"
version = "0.1.0"
description = "MCP tools for Blender scene editing and game asset export"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "pydantic>=2.11,<3"]

[project.scripts]
cavi-blender-mcp = "cavi_blender_mcp.server:main"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cavi_blender_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
